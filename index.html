<!DOCTYPE html>

<html lang="zh-TW" data-theme="sage">



<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>學習資料管理 Dashboard | Happy Hues Edition</title>

  <meta name="description" content="Happy Hues 繽紛風格 - 自訂學習資料與複習連結管理系統 (支援 Supabase 雲端多群組與個人檔案)">

  <!-- Favicon / Icons -->
  <link rel="icon" type="image/png" href="education-32-32.png">
  <link rel="apple-touch-icon" href="education-32-32.png">



  <!-- Google Fonts -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet">





  <!-- Lucide Icons -->

  <script src="https://unpkg.com/lucide@latest"></script>



  <!-- Supabase JS Client CDN -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- SweetAlert2 CDN -->

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>




</head>



<body class="min-h-screen flex flex-col antialiased selection:bg-amber-300 selection:text-slate-900">



  <!-- Header Bar -->

  <header
    class="sticky top-0 z-30 bg-(--hh-card) border-b-4 border-(--hh-card-border) px-4 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4 shadow-sm">



    <!-- Title & Brand -->

    <div class="flex items-center space-x-3">

      <div
        class="w-11 h-11 rounded-xl bg-(--hh-btn-main) border-2 border-(--hh-card-border) flex items-center justify-center shadow-[3px_3px_0px_0px_var(--hh-shadow)] shrink-0 p-1">

        <img src="education-64-64.png" alt="Study Dashboard Logo" class="w-full h-full object-contain">

      </div>

      <div>

        <h1 class="text-lg lg:text-xl font-black tracking-tight hh-headline">Study Dashboard</h1>

        <p class="text-xs font-semibold text-(--hh-paragraph) opacity-85">Supabase 雲端多群組版</p>

      </div>

    </div>



    <!-- Central Dashboard Context Selector & Search -->

    <div
      class="flex-1 max-w-xl mx-auto order-last md:order-none w-full md:w-auto flex flex-col sm:flex-row items-center gap-2 justify-center">



      <!-- Dashboard Switcher Select -->

      <div class="relative w-full sm:w-auto">

        <select id="dashboardContextSelect"
          class="w-full hh-input px-3.5 py-2 text-xs font-black rounded-xl cursor-pointer shadow-sm pr-8 bg-(--hh-accent-ice)">

          <option value="personal">🔒 個人雲端 Dashboard</option>

          <optgroup label="👥 我的學習群組" id="groupOptGroup">

            <!-- Dynamically Rendered -->

          </optgroup>

          <optgroup label="⚙️ 群組操作">

            <option value="action_create_group">➕ 建立新群組...</option>

            <option value="action_join_group">🔑 輸入邀請碼加入群組...</option>

            <option value="action_manage_groups">⚙️ 群組成員與審核管理...</option>

          </optgroup>

        </select>

      </div>



      <!-- Search Trigger Button -->

      <button id="btnOpenSearch"
        class="w-full sm:flex-1 hh-btn-secondary px-3.5 py-2 text-xs font-bold flex items-center justify-between gap-2 shadow-sm transition hover:scale-[1.02] active:scale-[0.98]"
        title="搜尋單元與連結 (Ctrl + K)">

        <div class="flex items-center gap-2 text-(--hh-paragraph) opacity-80 overflow-hidden">

          <i data-lucide="search" class="w-4 h-4 text-(--hh-headline) shrink-0"></i>

          <span class="truncate">搜尋單元與連結...</span>

        </div>

        <kbd
          class="hidden sm:inline-flex items-center gap-0.5 px-2 py-0.5 text-[10px] font-mono font-bold rounded-md bg-(--hh-accent-ice) text-(--hh-headline) border border-(--hh-card-border) shadow-xs shrink-0">

          <span>Ctrl</span><span>K</span>

        </kbd>

      </button>



    </div>



    <!-- Controls & Auth Profile Area -->

    <div class="flex flex-wrap items-center gap-2 sm:gap-3">



      <!-- Theme Switcher Selector -->

      <div class="relative flex items-center">

        <select id="themeSelector"
          class="hh-input px-3 py-1.5 text-xs font-bold rounded-xl cursor-pointer shadow-sm pr-8" title="切換色調">

          <option value="sage">🌿 舒緩森林</option>

          <option value="dusk">🌙 柔和夜讀</option>

          <option value="light">☀️ 極簡明亮</option>

        </select>

      </div>



      <!-- User Auth & Profile Pill -->

      <div id="authPillContainer" class="flex items-center gap-1.5">

        <!-- JS Rendered (Login button OR Avatar + Profile Menu) -->

      </div>



    </div>

  </header>



  <!-- iPad / Mobile Segmented Tab Switcher -->

  <div class="lg:hidden max-w-7xl w-full mx-auto px-4 pt-4">

    <div
      class="grid grid-cols-2 gap-2 p-1.5 rounded-xl border-2 border-(--hh-card-border) bg-(--hh-card) shadow-sm">

      <button id="tabBtnNav"
        class="py-2 text-xs font-bold rounded-lg border-2 border-transparent bg-(--hh-btn-main) text-(--hh-btn-text) shadow-sm flex items-center justify-center gap-1.5">

        <i data-lucide="book-open" class="w-4 h-4"></i>

        <span>科目與單元範圍</span>

      </button>

      <button id="tabBtnLinks"
        class="py-2 text-xs font-bold rounded-lg border-2 border-transparent text-(--hh-paragraph) flex items-center justify-center gap-1.5">

        <i data-lucide="link" class="w-4 h-4"></i>

        <span>學習資源連結</span>

      </button>

    </div>

  </div>



  <!-- Main Outer Container -->

  <div class="flex-1 py-4 lg:py-6 px-2 sm:px-4">



    <!-- Main Content Grid -->

    <main class="w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-5 lg:gap-6">



      <!-- Column 1 & 2 Wrapper (Side-by-side or stacked for iPad nav) -->

      <div id="navColumnsWrapper" class="lg:col-span-6 grid grid-cols-1 md:grid-cols-2 gap-5 lg:gap-6">



        <!-- Column 1: Subjects (Left Sidebar) -->

        <section class="hh-card p-4 flex flex-col relative overflow-hidden">

          <div class="flex items-center justify-between mb-3 pb-3 border-b-2 border-(--hh-card-border)">

            <div class="flex items-center gap-2">

              <i data-lucide="book-open" class="w-5 h-5 text-(--hh-headline)"></i>

              <h2 class="font-extrabold text-sm tracking-wide hh-headline uppercase">學習資料</h2>

            </div>

            <div class="flex items-center gap-1.5">

              <button id="btnImportPersonalData" onclick="promptImportPersonalDataModal()"
                class="hidden hh-btn-secondary px-3 py-1.5 text-xs flex items-center gap-1" title="匯入個人學習資料">

                <i data-lucide="download" class="w-4 h-4"></i>

                <span class="hidden sm:inline">匯入</span>

              </button>

              <button id="btnAddSubject" class="hh-btn-primary px-3 py-1.5 text-xs flex items-center gap-1">

                <i data-lucide="plus" class="w-4 h-4"></i>

                <span>新增科目</span>

              </button>

            </div>

          </div>



          <!-- Folder Selector Bar -->
          <div id="folderSelectorBar" class="mb-3 flex items-center justify-between gap-2">
            <!-- JS Rendered Folder Dropdown -->
          </div>

          <!-- Subject List Container -->

          <div id="subjectList" class="flex-1 overflow-y-auto space-y-2.5 pr-1 max-h-[calc(100vh-280px)] min-h-[160px]">

            <!-- JS Rendered -->

          </div>

        </section>



        <!-- Column 2: Ranges (Middle Sidebar) -->

        <section class="hh-card p-4 flex flex-col relative overflow-hidden">

          <div class="flex items-center justify-between mb-4 pb-3 border-b-2 border-(--hh-card-border)">

            <div class="flex items-center gap-2 overflow-hidden">

              <i data-lucide="layers" class="w-5 h-5 text-(--hh-headline) shrink-0"></i>

              <h2 class="font-extrabold text-sm tracking-wide hh-headline uppercase truncate">單元範圍</h2>

            </div>

            <button id="btnAddRange"
              class="hh-btn-primary px-3 py-1.5 text-xs flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed"
              disabled>

              <i data-lucide="plus" class="w-4 h-4"></i>

              <span>新增範圍</span>

            </button>

          </div>

          <!-- Range List Container -->

          <div id="rangeList" class="flex-1 overflow-y-auto space-y-2.5 pr-1 max-h-[calc(100vh-280px)] min-h-[160px]">

            <!-- JS Rendered -->

          </div>

        </section>



      </div>



      <!-- Column 3: Links (Main Content Area) -->

      <section id="linksColumnWrapper" class="lg:col-span-6 hh-card p-4 lg:p-6 flex flex-col relative">



        <!-- Content Header & Breadcrumb -->

        <div
          class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5 pb-4 border-b-2 border-(--hh-card-border)">

          <div>

            <!-- Dynamic Breadcrumb -->

            <nav id="breadcrumbNav"
              class="flex items-center gap-2 text-xs font-bold text-(--hh-paragraph) opacity-75 mb-1">

              <span>請先選取科目與範圍</span>

            </nav>

            <h3 id="currentRangeTitle" class="text-lg lg:text-xl font-black hh-headline flex items-center gap-2">

              <span>學習資源連結</span>

            </h3>

          </div>



          <span id="linkCountBadge" class="self-start sm:self-center hh-badge px-3 py-1 text-xs rounded-full">

            0 個連結

          </span>

        </div>

        <!-- Create Link Form (Hidden initially) -->

        <div id="addLinkFormCard"
          class="mb-6 p-4 rounded-xl border-2 border-(--hh-card-border) bg-(--hh-card) shadow-sm hidden">

          <h4 class="text-xs font-black hh-headline uppercase tracking-wider mb-3 flex items-center gap-1.5">

            <i data-lucide="link-2" class="w-4 h-4"></i>

            <span>新增學習連結</span>

          </h4>

          <form id="linkForm" class="flex flex-col gap-3">

            <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">

              <div class="sm:col-span-5">

                <input type="text" id="linkTitleInput" placeholder="連結名稱 (例: 講義/筆記)" required
                  class="w-full px-3.5 py-2 text-xs font-semibold hh-input">

              </div>

              <div class="sm:col-span-7">

                <input type="text" id="linkUrlInput" placeholder="網址 (例: https://...)" required
                  class="w-full px-3.5 py-2 text-xs font-semibold hh-input">

              </div>

            </div>

            <div class="flex justify-end pt-1">

              <button type="submit" class="hh-btn-primary px-5 py-2 text-xs font-black flex items-center gap-1.5">

                <i data-lucide="plus-circle" class="w-4 h-4"></i>

                <span>儲存連結</span>

              </button>

            </div>

          </form>

        </div>



        <!-- Link Cards Grid Container -->

        <div id="linkList" class="flex-1 overflow-y-auto max-h-[calc(100vh-360px)] min-h-[220px] pr-1 space-y-3">

          <!-- JS Rendered -->

        </div>



      </section>



    </main>



  </div>



  <!-- Search Modal Overlay -->

  <div id="searchModalOverlay"
    class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-start justify-center pt-12 sm:pt-20 p-4 opacity-0 pointer-events-none transition-opacity duration-200">

    <div id="searchModalContent"
      class="hh-card w-full max-w-xl bg-(--hh-card) p-4 sm:p-6 shadow-2xl transform scale-95 transition-transform duration-200 flex flex-col max-h-[80vh]">



      <!-- Search Input Box Header -->

      <div class="relative flex items-center mb-4">

        <i data-lucide="search" class="w-5 h-5 absolute left-3.5 text-(--hh-headline) pointer-events-none"></i>

        <input type="text" id="searchInput" placeholder="搜尋單元範圍或連結名稱..."
          class="w-full pl-11 pr-10 py-3 text-sm font-bold hh-input rounded-xl border-2" autocomplete="off">

        <button id="btnClearSearch"
          class="absolute right-3 p-1 rounded-lg hover:bg-(--hh-accent-ice) text-(--hh-paragraph) hidden transition"
          title="清除關鍵字">

          <i data-lucide="x" class="w-4 h-4"></i>

        </button>

      </div>



      <!-- Search Results Container -->

      <div id="searchResultsList" class="flex-1 overflow-y-auto space-y-2 pr-1 min-h-[180px] max-h-[50vh]">

        <!-- JS Rendered Results -->

      </div>



      <!-- Footer Help Bar -->

      <div
        class="mt-4 pt-3 border-t-2 border-(--hh-card-border) flex flex-wrap items-center justify-between gap-2 text-[11px] font-bold text-(--hh-paragraph) opacity-75">

        <div class="flex items-center gap-3">

          <span class="flex items-center gap-1"><kbd
              class="px-1.5 py-0.5 rounded bg-(--hh-accent-ice) border border-(--hh-card-border)">Esc</kbd>

            關閉</span>

          <span class="flex items-center gap-1"><kbd
              class="px-1.5 py-0.5 rounded bg-(--hh-accent-ice) border border-(--hh-card-border)">↑</kbd><kbd
              class="px-1.5 py-0.5 rounded bg-(--hh-accent-ice) border border-(--hh-card-border)">↓</kbd>

            選擇</span>

          <span class="flex items-center gap-1"><kbd
              class="px-1.5 py-0.5 rounded bg-(--hh-accent-ice) border border-(--hh-card-border)">Enter</kbd>

            開啟</span>

        </div>

        <span id="searchResultCount" class="hh-badge px-2.5 py-0.5 rounded-full text-[10px]">0 筆結果</span>

      </div>



    </div>

  </div>



  <!-- Reusable Custom Modal -->

  <div id="modalOverlay"
    class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">

    <div id="modalContent"
      class="hh-card w-full max-w-md p-6 bg-white transform scale-95 transition-transform duration-200">



      <div class="flex items-center justify-between mb-4 pb-3 border-b-2 border-(--hh-card-border)">

        <h3 id="modalTitle" class="text-base font-black hh-headline flex items-center gap-2">

          <!-- Icon & Title -->

        </h3>

        <button id="btnModalClose"
          class="p-1 rounded-lg border border-(--hh-card-border) hover:bg-(--hh-accent-ice) transition">

          <i data-lucide="x" class="w-5 h-5 text-(--hh-headline)"></i>

        </button>

      </div>



      <div id="modalBody" class="space-y-4 font-semibold text-xs text-(--hh-paragraph)">

        <!-- Dynamic Input or Description -->

      </div>



      <div class="flex justify-end gap-3 mt-6 pt-4 border-t-2 border-(--hh-card-border)">

        <button id="btnModalCancel" class="hh-btn-secondary px-4 py-2 text-xs">

          取消

        </button>

        <button id="btnModalConfirm" class="hh-btn-primary px-5 py-2 text-xs">

          確認

        </button>

      </div>



    </div>

  </div>



  <!-- Toast Notification System Container -->

  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 pointer-events-none"></div>



  <!-- JavaScript Logic -->

  <script type="module" src="./app.js"></script>

</body>



</html>
