<!DOCTYPE html>

<html lang="zh-TW" data-theme="sage">



<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>學習資料管理 Dashboard | Happy Hues Edition</title>

  <meta name="description" content="Happy Hues 繽紛風格 - 自訂學習資料與複習連結管理系統 (支援 Supabase 雲端多群組與個人檔案)">

  <!-- Favicon / Icons -->
  <link rel="icon" type="image/png" href="education-32-32.png">
  <link rel="apple-touch-icon" href="education-32-32.png">



  <!-- Google Fonts -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet">



  <!-- Tailwind CSS CDN -->

  <script src="https://cdn.tailwindcss.com"></script>

  <script>

    tailwind.config = {

      darkMode: 'class',

      theme: {

        extend: {

          fontFamily: {

            sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', 'sans-serif'],

          },

          screens: {

            'ipad-portrait': { 'raw': '(min-width: 768px) and (max-width: 1024px) and (orientation: portrait)' },

            'ipad-landscape': { 'raw': '(min-width: 1024px) and (max-width: 1280px)' },

          }

        }

      }

    }

  </script>



  <!-- Lucide Icons -->

  <script src="https://unpkg.com/lucide@latest"></script>



  <!-- Supabase JS Client CDN -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



  <style>
    /* --- HAPPY HUES & STUDY FOCUS DESIGN SYSTEM THEMES --- */



    /* 1. Focus Sage Green (🌿 舒緩森林 - 沉穩耐看，大幅降低眼睛疲勞感) */

    :root[data-theme="sage"] {

      --hh-bg: #f1f5f2;

      --hh-headline: #1b382b;

      --hh-paragraph: #2d4c3e;

      --hh-card: #ffffff;

      --hh-card-border: #1b382b;

      --hh-card-hover-border: #52796f;

      --hh-btn-main: #52796f;

      --hh-btn-main-hover: #354f52;

      --hh-btn-text: #ffffff;

      --hh-accent-blush: #cad2c5;

      --hh-accent-ice: #e8f0ec;

      --hh-accent-teal: #84a59d;

      --hh-shadow: #1b382b;

      --hh-badge-bg: #e8f0ec;

      --hh-badge-text: #1b382b;

      --hh-input-bg: #ffffff;

    }



    /* 2. Soft Dusk Dark Mode (🌙 柔和夜讀 - 晚間低藍光防刺眼暗色調) */

    :root[data-theme="dusk"] {

      --hh-bg: #1a1c23;

      --hh-headline: #f0f2f5;

      --hh-paragraph: #94a3b8;

      --hh-card: #222530;

      --hh-card-border: #4a5568;

      --hh-card-hover-border: #dd6b20;

      --hh-btn-main: #dd6b20;

      --hh-btn-main-hover: #c05621;

      --hh-btn-text: #ffffff;

      --hh-accent-blush: #2d3748;

      --hh-accent-ice: #2d3748;

      --hh-accent-teal: #718096;

      --hh-shadow: #111318;

      --hh-badge-bg: #2d3748;

      --hh-badge-text: #ed8936;

      --hh-input-bg: #1a1c23;

    }



    /* 3. Pure Light (☀️ 極簡明亮 - 清新極簡高對比) */

    :root[data-theme="light"] {

      --hh-bg: #f8fafc;

      --hh-headline: #0f172a;

      --hh-paragraph: #334155;

      --hh-card: #ffffff;

      --hh-card-border: #cbd5e1;

      --hh-card-hover-border: #3b82f6;

      --hh-btn-main: #3b82f6;

      --hh-btn-main-hover: #2563eb;

      --hh-btn-text: #ffffff;

      --hh-accent-blush: #e2e8f0;

      --hh-accent-ice: #f1f5f9;

      --hh-accent-teal: #94a3b8;

      --hh-shadow: #94a3b8;

      --hh-badge-bg: #e2e8f0;

      --hh-badge-text: #1e40af;

      --hh-input-bg: #ffffff;

    }







    /* Base Body Applying Happy Hues Palette */

    body {

      background-color: var(--hh-bg);

      color: var(--hh-paragraph);

      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;

      transition: background-color 0.3s ease, color 0.3s ease;

    }



    /* Dynamic Custom Scrollbar */

    ::-webkit-scrollbar {

      width: 6px;

      height: 6px;

    }



    ::-webkit-scrollbar-track {

      background: transparent;

    }



    ::-webkit-scrollbar-thumb {

      background: var(--hh-card-border);

      border-radius: 9999px;

      opacity: 0.5;

    }



    /* Happy Hues Neo-Tactile Box Shadows & Borders */

    .hh-card {

      background-color: var(--hh-card);

      border: 2.5px solid var(--hh-card-border);

      box-shadow: 4px 4px 0px 0px var(--hh-shadow);

      border-radius: 16px;

      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);

    }



    .hh-card:hover {

      transform: translateY(-2px);

      box-shadow: 6px 6px 0px 0px var(--hh-shadow);

      border-color: var(--hh-card-hover-border);

    }



    .hh-card-active {

      background-color: var(--hh-accent-ice);

      border-color: var(--hh-card-border);

      box-shadow: 4px 4px 0px 0px var(--hh-shadow);

    }



    .hh-btn-primary {

      background-color: var(--hh-btn-main);

      color: var(--hh-btn-text);

      border: 2px solid var(--hh-card-border);

      box-shadow: 3px 3px 0px 0px var(--hh-shadow);

      font-weight: 700;

      border-radius: 12px;

      min-height: 44px;

      transition: all 0.15s ease;

    }



    .hh-btn-primary:hover {

      background-color: var(--hh-btn-main-hover);

      transform: translate(-1px, -1px);

      box-shadow: 4px 4px 0px 0px var(--hh-shadow);

    }



    .hh-btn-primary:active {

      transform: translate(2px, 2px);

      box-shadow: 1px 1px 0px 0px var(--hh-shadow);

    }



    /* Custom Radio Dot & Preset Option Card Styling */

    .preset-mode-card {

      background-color: var(--hh-card);

      border: 2.5px solid var(--hh-card-border);

      box-shadow: 3px 3px 0px 0px var(--hh-shadow);

      border-radius: 14px;

      padding: 0.75rem 0.85rem;

      cursor: pointer;

      display: flex;

      flex-direction: column;

      justify-content: space-between;

      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);

    }



    .preset-mode-card:hover {

      border-color: var(--hh-btn-main);

      transform: translateY(-2px);

      box-shadow: 4px 4px 0px 0px var(--hh-shadow);

    }



    .preset-mode-card:has(input[type="radio"]:checked) {

      border-color: var(--hh-btn-main);

      background-color: var(--hh-accent-ice);

      box-shadow: 0 0 0 2px var(--hh-btn-main), 3px 3px 0px 0px var(--hh-shadow);

    }



    .preset-radio-dot {

      appearance: none;

      -webkit-appearance: none;

      width: 1.25rem;

      height: 1.25rem;

      border: 2px solid var(--hh-card-border);

      border-radius: 50%;

      outline: none;

      display: grid;

      place-content: center;

      background-color: var(--hh-card);

      transition: all 0.15s ease-in-out;

      cursor: pointer;

      flex-shrink: 0;

      margin: 0;

    }



    .preset-radio-dot::before {

      content: "";

      width: 0.65rem;

      height: 0.65rem;

      border-radius: 50%;

      transform: scale(0);

      transition: 0.15s transform ease-in-out;

      background-color: var(--hh-btn-main);

    }



    .preset-radio-dot:checked {

      border-color: var(--hh-btn-main);

      border-width: 2.5px;

      background-color: var(--hh-card);

    }



    .preset-radio-dot:checked::before {

      transform: scale(1);

    }



    .hh-btn-secondary {

      background-color: var(--hh-card);

      color: var(--hh-headline);

      border: 2px solid var(--hh-card-border);

      box-shadow: 3px 3px 0px 0px var(--hh-shadow);

      font-weight: 600;

      border-radius: 12px;

      min-height: 44px;

      transition: all 0.15s ease;

    }



    .hh-btn-secondary:hover {

      background-color: var(--hh-accent-ice);

      transform: translate(-1px, -1px);

      box-shadow: 4px 4px 0px 0px var(--hh-shadow);

    }



    .hh-btn-secondary:active {

      transform: translate(2px, 2px);

      box-shadow: 1px 1px 0px 0px var(--hh-shadow);

    }



    .hh-input {

      background-color: var(--hh-input-bg);

      border: 2px solid var(--hh-card-border);

      color: var(--hh-headline);

      border-radius: 10px;

      min-height: 44px;

      box-shadow: inset 2px 2px 0px rgba(0, 0, 0, 0.05);

    }



    .hh-input:focus {
      outline: none;
      border-color: var(--hh-btn-main);
      box-shadow: 0 0 0 3px rgba(255, 216, 3, 0.3);
    }

    .hh-input::placeholder {
      color: var(--hh-paragraph);
      opacity: 0.55;
      font-weight: 600;
      letter-spacing: normal;
    }

    #inputJoinCode::placeholder {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: normal;
      opacity: 0.55;
    }




    .hh-headline {

      color: var(--hh-headline);

    }



    .hh-badge {

      background-color: var(--hh-badge-bg);

      color: var(--hh-badge-text);

      border: 1.5px solid var(--hh-card-border);

      font-weight: 700;

    }



    /* Keyframe Animations */

    @keyframes popIn {

      0% {

        transform: scale(0.96);

        opacity: 0;

      }



      100% {

        transform: scale(1);

        opacity: 1;

      }

    }



    .animate-pop-in {

      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;

    }



    @keyframes pulseHighlight {

      0% {

        box-shadow: 0 0 0 4px rgba(255, 216, 3, 0.9), 4px 4px 0px 0px var(--hh-shadow);

        transform: scale(1.02);

      }



      50% {

        box-shadow: 0 0 0 8px rgba(255, 216, 3, 0.6), 6px 6px 0px 0px var(--hh-shadow);

        transform: scale(1.03);

      }



      100% {

        box-shadow: 4px 4px 0px 0px var(--hh-shadow);

        transform: scale(1);

      }

    }



    .animate-pulse-highlight {

      animation: pulseHighlight 1.2s ease-in-out forwards;

    }
  </style>

</head>



<body class="min-h-screen flex flex-col antialiased selection:bg-amber-300 selection:text-slate-900">



  <!-- Header Bar -->

  <header
    class="sticky top-0 z-30 bg-[var(--hh-card)] border-b-4 border-[var(--hh-card-border)] px-4 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4 shadow-sm">



    <!-- Title & Brand -->

    <div class="flex items-center space-x-3">

      <div
        class="w-11 h-11 rounded-xl bg-[var(--hh-btn-main)] border-2 border-[var(--hh-card-border)] flex items-center justify-center shadow-[3px_3px_0px_0px_var(--hh-shadow)] shrink-0 p-1">

        <img src="education-64-64.png" alt="Study Dashboard Logo" class="w-full h-full object-contain">

      </div>

      <div>

        <h1 class="text-lg lg:text-xl font-black tracking-tight hh-headline">Study Dashboard</h1>

        <p class="text-xs font-semibold text-[var(--hh-paragraph)] opacity-85">Supabase 雲端多群組版</p>

      </div>

    </div>



    <!-- Central Dashboard Context Selector & Search -->

    <div
      class="flex-1 max-w-xl mx-auto order-last md:order-none w-full md:w-auto flex flex-col sm:flex-row items-center gap-2 justify-center">



      <!-- Dashboard Switcher Select -->

      <div class="relative w-full sm:w-auto">

        <select id="dashboardContextSelect"
          class="w-full hh-input px-3.5 py-2 text-xs font-black rounded-xl cursor-pointer shadow-sm pr-8 bg-[var(--hh-accent-ice)]">

          <option value="personal">🔒 個人雲端 Dashboard</option>

          <optgroup label="👥 我的學習群組" id="groupOptGroup">

            <!-- Dynamically Rendered -->

          </optgroup>

          <optgroup label="⚙️ 群組操作">

            <option value="action_create_group">➕ 建立新群組...</option>

            <option value="action_join_group">🔑 輸入邀請碼加入群組...</option>

            <option value="action_manage_groups">⚙️ 群組成員與審核管理...</option>

          </optgroup>

        </select>

      </div>



      <!-- Search Trigger Button -->

      <button id="btnOpenSearch"
        class="w-full sm:flex-1 hh-btn-secondary px-3.5 py-2 text-xs font-bold flex items-center justify-between gap-2 shadow-sm transition hover:scale-[1.02] active:scale-[0.98]"
        title="搜尋單元與連結 (Ctrl + K)">

        <div class="flex items-center gap-2 text-[var(--hh-paragraph)] opacity-80 overflow-hidden">

          <i data-lucide="search" class="w-4 h-4 text-[var(--hh-headline)] shrink-0"></i>

          <span class="truncate">搜尋單元與連結...</span>

        </div>

        <kbd
          class="hidden sm:inline-flex items-center gap-0.5 px-2 py-0.5 text-[10px] font-mono font-bold rounded-md bg-[var(--hh-accent-ice)] text-[var(--hh-headline)] border border-[var(--hh-card-border)] shadow-xs shrink-0">

          <span>Ctrl</span><span>K</span>

        </kbd>

      </button>



    </div>



    <!-- Controls & Auth Profile Area -->

    <div class="flex flex-wrap items-center gap-2 sm:gap-3">



      <!-- Theme Switcher Selector -->

      <div class="relative flex items-center">

        <select id="themeSelector"
          class="hh-input px-3 py-1.5 text-xs font-bold rounded-xl cursor-pointer shadow-sm pr-8" title="切換色調">

          <option value="sage">🌿 舒緩森林</option>

          <option value="dusk">🌙 柔和夜讀</option>

          <option value="light">☀️ 極簡明亮</option>

        </select>

      </div>



      <!-- User Auth & Profile Pill -->

      <div id="authPillContainer" class="flex items-center gap-1.5">

        <!-- JS Rendered (Login button OR Avatar + Profile Menu) -->

      </div>



    </div>

  </header>



  <!-- iPad / Mobile Segmented Tab Switcher -->

  <div class="lg:hidden max-w-7xl w-full mx-auto px-4 pt-4">

    <div
      class="grid grid-cols-2 gap-2 p-1.5 rounded-xl border-2 border-[var(--hh-card-border)] bg-[var(--hh-card)] shadow-sm">

      <button id="tabBtnNav"
        class="py-2 text-xs font-bold rounded-lg border-2 border-transparent bg-[var(--hh-btn-main)] text-[var(--hh-btn-text)] shadow-sm flex items-center justify-center gap-1.5">

        <i data-lucide="book-open" class="w-4 h-4"></i>

        <span>科目與單元範圍</span>

      </button>

      <button id="tabBtnLinks"
        class="py-2 text-xs font-bold rounded-lg border-2 border-transparent text-[var(--hh-paragraph)] flex items-center justify-center gap-1.5">

        <i data-lucide="link" class="w-4 h-4"></i>

        <span>學習資源連結</span>

      </button>

    </div>

  </div>



  <!-- Main Outer Container -->

  <div class="flex-1 py-4 lg:py-6 px-2 sm:px-4">



    <!-- Main Content Grid -->

    <main class="w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-5 lg:gap-6">



      <!-- Column 1 & 2 Wrapper (Side-by-side or stacked for iPad nav) -->

      <div id="navColumnsWrapper" class="lg:col-span-6 grid grid-cols-1 md:grid-cols-2 gap-5 lg:gap-6">



        <!-- Column 1: Subjects (Left Sidebar) -->

        <section class="hh-card p-4 flex flex-col relative overflow-hidden">

          <div class="flex items-center justify-between mb-3 pb-3 border-b-2 border-[var(--hh-card-border)]">

            <div class="flex items-center gap-2">

              <i data-lucide="book-open" class="w-5 h-5 text-[var(--hh-headline)]"></i>

              <h2 class="font-extrabold text-sm tracking-wide hh-headline uppercase">學習資料</h2>

            </div>

            <div class="flex items-center gap-1.5">

              <button id="btnImportPersonalData" onclick="promptImportPersonalDataModal()"
                class="hidden hh-btn-secondary px-3 py-1.5 text-xs flex items-center gap-1" title="匯入個人學習資料">

                <i data-lucide="download" class="w-4 h-4"></i>

                <span class="hidden sm:inline">匯入</span>

              </button>

              <button id="btnAddSubject" class="hh-btn-primary px-3 py-1.5 text-xs flex items-center gap-1">

                <i data-lucide="plus" class="w-4 h-4"></i>

                <span>新增科目</span>

              </button>

            </div>

          </div>



          <!-- Folder Selector Bar -->

          <div id="folderSelectorBar" class="mb-3 flex items-center justify-between gap-2">

            <!-- JS Rendered Folder Dropdown -->

          </div>



          <!-- Subject List Container -->

          <div id="subjectList" class="flex-1 overflow-y-auto space-y-2.5 pr-1 max-h-[calc(100vh-280px)] min-h-[160px]">

            <!-- JS Rendered -->

          </div>

        </section>



        <!-- Column 2: Ranges (Middle Sidebar) -->

        <section class="hh-card p-4 flex flex-col relative overflow-hidden">

          <div class="flex items-center justify-between mb-4 pb-3 border-b-2 border-[var(--hh-card-border)]">

            <div class="flex items-center gap-2 overflow-hidden">

              <i data-lucide="layers" class="w-5 h-5 text-[var(--hh-headline)] shrink-0"></i>

              <h2 class="font-extrabold text-sm tracking-wide hh-headline uppercase truncate">單元範圍</h2>

            </div>

            <button id="btnAddRange"
              class="hh-btn-primary px-3 py-1.5 text-xs flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed"
              disabled>

              <i data-lucide="plus" class="w-4 h-4"></i>

              <span>新增範圍</span>

            </button>

          </div>



          <!-- Range List Container -->

          <div id="rangeList" class="flex-1 overflow-y-auto space-y-2.5 pr-1 max-h-[calc(100vh-280px)] min-h-[160px]">

            <!-- JS Rendered -->

          </div>

        </section>



      </div>



      <!-- Column 3: Links (Main Content Area) -->

      <section id="linksColumnWrapper" class="lg:col-span-6 hh-card p-4 lg:p-6 flex flex-col relative">



        <!-- Content Header & Breadcrumb -->

        <div
          class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5 pb-4 border-b-2 border-[var(--hh-card-border)]">

          <div>

            <!-- Dynamic Breadcrumb -->

            <nav id="breadcrumbNav"
              class="flex items-center gap-2 text-xs font-bold text-[var(--hh-paragraph)] opacity-75 mb-1">

              <span>請先選取科目與範圍</span>

            </nav>

            <h3 id="currentRangeTitle" class="text-lg lg:text-xl font-black hh-headline flex items-center gap-2">

              <span>學習資源連結</span>

            </h3>

          </div>



          <span id="linkCountBadge" class="self-start sm:self-center hh-badge px-3 py-1 text-xs rounded-full">

            0 個連結

          </span>

        </div>



        <!-- Add Link Form Card -->

        <div id="addLinkFormCard"
          class="mb-6 p-4 rounded-xl border-2 border-[var(--hh-card-border)] bg-[var(--hh-card)] shadow-sm hidden">

            <span>新增學習連結</span>

            <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">

                <i data-lucide="plus-circle" class="w-4 h-4"></i>

                <span>儲存連結</span>

              </button>

        </div>



        <!-- Link Cards Grid Container -->

          <!-- JS Rendered -->

        </div>



      </section>



    </main>



  </div>

      <!-- Search Input Box Header -->

        <i data-lucide="search" class="w-5 h-5 absolute left-3.5 text-[var(--hh-headline)] pointer-events-none"></i>

        <button id="btnClearSearch"

          <i data-lucide="x" class="w-4 h-4"></i>

        </button>

      </div>



      <!-- Search Results Container -->

      <div id="searchResultsList" class="flex-1 overflow-y-auto space-y-2 pr-1 min-h-[180px] max-h-[50vh]">

        <!-- JS Rendered Results -->

      </div>

    // --- Supabase Client & Cloud Sync Engine ---



    function initSupabase() {

      try {

        let url = DEFAULT_SUPABASE_URL;

        let key = DEFAULT_SUPABASE_KEY;



        const storedCfg = localStorage.getItem(SUPABASE_CONFIG_KEY);

        if (storedCfg) {

          const parsed = JSON.parse(storedCfg);

          if (parsed && parsed.url && parsed.key) {

            url = parsed.url;

            key = parsed.key;

          }

        }



        if (url && key && typeof supabase !== 'undefined') {

          url = url.replace(/\/rest\/v1\/?$/, '').replace(/\/+$/, '');

          supabaseClient = supabase.createClient(url, key);

          checkSupabaseSession();



          supabaseClient.auth.onAuthStateChange((event, session) => {

            if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {

              checkSupabaseSession();

            } else if (event === 'SIGNED_OUT') {

              currentUser = null;

              myGroups = [];

              currentDashboardContext = 'personal';

              renderAuthPill();

              renderDashboardContextOptions();

              loadState();

              renderAll();

            }

          });

          return;

        }

      } catch (err) {

        console.warn('Supabase config not set or invalid:', err);

      }

      renderAuthPill();

    }



    async function checkSupabaseSession() {

      if (!supabaseClient) {

        loadState();

        renderAll();

        return;

      }

      try {

        const { data: { session } } = await supabaseClient.auth.getSession();

        if (session && session.user) {

          await loadUserProfile(session.user);

          await loadUserGroups();

          await loadDashboardData();

          setupRealtimeSubscription();

        } else {

          currentUser = null;

          loadState();

          renderAll();

        }

      } catch (err) {

        console.error('Failed to get session', err);

        loadState();

        renderAll();

      }

      renderAuthPill();

    }



    async function loadDashboardData() {

      if (!supabaseClient || !currentUser) {

        loadState();

        renderAll();

        return;

      }



      try {

        let query = supabaseClient.from('subjects').select('*, ranges(*, resource_links(*, creator:profiles!resource_links_created_by_fkey(nickname, avatar_url), editor:profiles!fk_resource_links_last_editor(nickname, avatar_url)))');



        if (currentDashboardContext === 'personal') {

          const activeFolder = getActiveFolder();

          if (!activeFolder) {

            state.folders = [];

            renderAll();

            return;

          }

          query = query.eq('user_id', currentUser.id).is('group_id', null).eq('preset_mode', activeFolder.id);

        } else {

          query = query.eq('group_id', currentDashboardContext);

        }



        let { data, error } = await query;

        if (error) throw error;



        if (currentDashboardContext !== 'personal') {

          if (!state.groupFolders) state.groupFolders = {};

          if (!state.groupFolders[currentDashboardContext]) {

            state.groupFolders[currentDashboardContext] = { folders: [], activeFolderId: null };

          }



          let parsedFoldersMap = new Map();

          let parsedSubjects = [];



          // Parse folders from meta subjects or infer from normal subjects

          (data || []).forEach(sub => {

            if (sub.name === '___FOLDER_META___') {

              const parts = (sub.preset_mode || '').split('|');

              if (parts.length >= 3) {

                const fId = parts[0];

                const fName = parts[1];

                const fMode = parts[2];

                if (!parsedFoldersMap.has(fId)) {

                  parsedFoldersMap.set(fId, { id: fId, name: fName, preset_mode: fMode, subjects: [] });

                }

              }

            } else {

              parsedSubjects.push(sub);

            }

          });



          // Re-construct loaded subjects

          const loadedSubs = parsedSubjects.map(sub => ({

            id: sub.id,

            name: sub.name,

            user_id: sub.user_id,

            group_id: sub.group_id,

            preset_mode: sub.preset_mode,

            ranges: (sub.ranges || []).map(rng => ({

              id: rng.id, name: rng.name, subject_id: rng.subject_id,

              links: (rng.resource_links || []).map(lnk => ({

                id: lnk.id, title: lnk.title, url: lnk.url, range_id: lnk.range_id, created_by: lnk.created_by,

                last_edited_by: lnk.last_edited_by, last_edited_at: lnk.last_edited_at, editor: lnk.editor || null, creator: lnk.creator || null

              }))

            }))

          }));



          // Assign subjects to folders based on preset_mode (which stores folder id)

          loadedSubs.forEach(sub => {

            const fId = sub.preset_mode;

            if (fId) {

              if (!parsedFoldersMap.has(fId)) {

                // Infer folder if meta was missing for some reason

                parsedFoldersMap.set(fId, { id: fId, name: '未命名專案', preset_mode: 'blank', subjects: [] });

              }

              parsedFoldersMap.get(fId).subjects.push(sub);

            }

          });



          // Restore local active folder id if valid

          let newFolders = Array.from(parsedFoldersMap.values());

          const oldActiveId = state.groupFolders[currentDashboardContext].activeFolderId;



          state.groupFolders[currentDashboardContext].folders = newFolders;

          if (newFolders.length > 0 && (!oldActiveId || !newFolders.find(f => f.id === oldActiveId))) {

            state.groupFolders[currentDashboardContext].activeFolderId = newFolders[0].id;

          }

          state.subjects = []; // Group mode subjects now live in the folder

        } else {

          // Personal Mode processing

          if (data && data.length > 0) {

            const loadedSubs = data.map(sub => ({

              id: sub.id, name: sub.name, user_id: sub.user_id, group_id: sub.group_id, preset_mode: sub.preset_mode,

              ranges: (sub.ranges || []).map(rng => ({

                id: rng.id, name: rng.name, subject_id: rng.subject_id,

                links: (rng.resource_links || []).map(lnk => ({

                  id: lnk.id, title: lnk.title, url: lnk.url, range_id: lnk.range_id, created_by: lnk.created_by,

                  last_edited_by: lnk.last_edited_by, last_edited_at: lnk.last_edited_at, editor: lnk.editor || null, creator: lnk.creator || null

                }))

              }))

            }));

            const activeFolder = getActiveFolder();

            if (activeFolder) activeFolder.subjects = loadedSubs;

          } else {

            const activeFolder = getActiveFolder();

            if (activeFolder && activeFolder.subjects.length === 0) {

              const presetObj = PRESET_MODES[activeFolder.preset_mode];

              if (presetObj && presetObj.subjects && presetObj.subjects.length > 0) {

                syncFolderSubjectsToCloud(activeFolder);

              }

            }

          }

        }



        validateStateDefensive();

        renderAll();

      } catch (err) {

        console.error('Failed to load dashboard data from Supabase:', err);

        showToast('雲端資料讀取失敗，使用本機暫存資料', 'danger');

        loadState();

        renderAll();

      }

    }



    async function syncFolderSubjectsToCloud(folder, isUpdateMetaOnly = false) {

      if (!supabaseClient || !currentUser) return;



      const isPersonal = currentDashboardContext === 'personal';

      const gId = isPersonal ? null : currentDashboardContext;

      const uId = isPersonal ? currentUser.id : null;



      let seedPayload = [];

      const metaMode = `${folder.id}|${folder.name}|${folder.preset_mode}`;



      // Add meta subject

      seedPayload.push({

        name: '___FOLDER_META___',

        user_id: uId,

        group_id: gId,

        preset_mode: metaMode

      });



      const localSubjects = folder.subjects.filter(s => typeof s.id === 'string' && s.id.startsWith('sub_'));

      const presetObj = PRESET_MODES[folder.preset_mode];



      if (!isUpdateMetaOnly) {

        if (localSubjects.length > 0) {

          localSubjects.forEach(s => {

            seedPayload.push({ name: s.name, user_id: uId, group_id: gId, preset_mode: folder.id });

          });

        } else if (folder.subjects.length === 0 && presetObj && presetObj.subjects) {

          presetObj.subjects.forEach(s => {

            seedPayload.push({ name: s.name, user_id: uId, group_id: gId, preset_mode: folder.id });

          });

        }

      }



      try {

        if (isUpdateMetaOnly) {

          let delQ = supabaseClient.from('subjects').delete().eq('name', '___FOLDER_META___').like('preset_mode', `${folder.id}|%`);

          if (isPersonal) delQ = delQ.eq('user_id', currentUser.id).is('group_id', null);

          else delQ = delQ.eq('group_id', gId);

          await delQ;

        }



        const { data: inserted, error: seedErr } = await supabaseClient.from('subjects').insert(seedPayload).select();

        if (seedErr) throw seedErr;



        if (inserted && !isUpdateMetaOnly) {

          const insertedNormal = inserted.filter(s => s.name !== '___FOLDER_META___');

          if (localSubjects.length > 0) {

            insertedNormal.forEach((dbSub, idx) => {

              if (localSubjects[idx]) localSubjects[idx].id = dbSub.id;

            });

          } else {

            folder.subjects = insertedNormal.map(s => ({

              id: s.id, name: s.name, user_id: s.user_id, group_id: s.group_id, preset_mode: folder.id, ranges: []

            }));

          }

          saveState();

          if (getContextActiveFolderId() === folder.id) renderAll();

        }

      } catch (err) {

        console.error('Background sync failed:', err);

        showToast('本機已儲存，雲端將於下次連線時同步', 'warning');

      }

    }



    function setupRealtimeSubscription() {

      if (!supabaseClient) return;



      if (realtimeChannel) {

        supabaseClient.removeChannel(realtimeChannel);

        realtimeChannel = null;

      }



      const chanName = `rt_ctx_${currentDashboardContext}_${Date.now()}`;

      realtimeChannel = supabaseClient.channel(chanName)

        .on('postgres_changes', { event: '*', schema: 'public', table: 'subjects' }, () => loadDashboardData())

        .on('postgres_changes', { event: '*', schema: 'public', table: 'ranges' }, () => loadDashboardData())

        .on('postgres_changes', { event: '*', schema: 'public', table: 'resource_links' }, () => loadDashboardData())

        .on('postgres_changes', { event: '*', schema: 'public', table: 'group_join_requests' }, () => loadUserGroups())

        .on('postgres_changes', { event: '*', schema: 'public', table: 'group_members' }, () => loadUserGroups())

        .subscribe();

    }



    async function loadUserProfile(authUser) {

      if (!supabaseClient) return;

      try {

        let { data: profile, error } = await supabaseClient

          .from('profiles')

          .select('*')

          .eq('id', authUser.id)

          .single();



        if (error || !profile) {

          // Create default profile from authUser meta

          const nickname = authUser.user_metadata?.full_name || authUser.email?.split('@')[0] || '學習者';

          const avatarUrl = authUser.user_metadata?.avatar_url || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + authUser.id;



          const newProfile = {

            id: authUser.id,

            email: authUser.email,

            nickname: nickname,

            avatar_url: avatarUrl

          };



          await supabaseClient.from('profiles').upsert(newProfile);



          let finalAvatarUrl = avatarUrl;

          if (finalAvatarUrl.includes('#local')) {

            const local = localStorage.getItem(`local_avatar_${authUser.id}`);

            if (local) finalAvatarUrl = local;

          }

          currentUser = { id: authUser.id, email: authUser.email, nickname, avatarUrl: finalAvatarUrl };

          promptProfileSetupModal(true); // Prompt onboarding

        } else {

          if (profile.current_preset_mode) {

            state.currentPresetMode = profile.current_preset_mode;

          }



          let finalAvatarUrl = profile.avatar_url || ('https://api.dicebear.com/7.x/bottts/svg?seed=' + profile.id);

          if (finalAvatarUrl.includes('#local')) {

            const local = localStorage.getItem(`local_avatar_${profile.id}`);

            if (local) finalAvatarUrl = local;

          }



          currentUser = {

            id: profile.id,

            email: profile.email || authUser.email,

            nickname: profile.nickname || '學習者',

            avatarUrl: finalAvatarUrl

          };

        }

      } catch (err) {

        console.error('Error loading profile', err);

      }

    }



    async function loadUserGroups() {

      if (!supabaseClient || !currentUser) return;

      try {

        // Fetch groups where user is a member

        const { data: memberships } = await supabaseClient

          .from('group_members')

          .select('group_id, role, groups(*)')

          .eq('user_id', currentUser.id);



        if (memberships) {

          myGroups = memberships.map(m => m.groups).filter(Boolean);

        } else {

          myGroups = [];

        }



        // Fetch pending requests for groups owned by user

        const ownedGroupIds = myGroups.filter(g => g.owner_id === currentUser.id).map(g => g.id);

        if (ownedGroupIds.length > 0) {

          const { data: reqs } = await supabaseClient

            .from('group_join_requests')

            .select('*, profiles(*), groups(*)')

            .in('group_id', ownedGroupIds)

            .eq('status', 'pending');

          pendingJoinRequests = reqs || [];

        } else {

          pendingJoinRequests = [];

        }



        renderDashboardContextOptions();

      } catch (err) {

        console.error('Failed loading groups', err);

      }

    }

        await supabaseClient.auth.signOut();

      }

      currentUser = null;

    // --- Core Data Initialization & Persistence ---



    function loadState() {

      try {

        let raw = localStorage.getItem(STORAGE_KEY);



        // 從舊版 v4 遷移：若 v5 不存在，檢查 v4 但自動濾除舊版產生的「預設專案資料夾」

        if (!raw) {

          const oldRaw = localStorage.getItem('study_agent_db_v4');

          if (oldRaw) {

            try {

              const oldState = JSON.parse(oldRaw);

              if (oldState && Array.isArray(oldState.folders)) {

                const userFolders = oldState.folders.filter(f => f.name !== '預設專案資料夾');

                if (userFolders.length > 0) {

                  state.folders = userFolders;

                  state.activeFolderId = oldState.activeFolderId && userFolders.some(f => f.id === oldState.activeFolderId)

                    ? oldState.activeFolderId

                    : userFolders[0].id;

                }

              }

            } catch (e) {

              console.warn('Failed to migrate from v4 state', e);

            }

          }

        }



        if (!raw && state.folders.length === 0) {

          state = {

            folders: [],

            activeFolderId: null,

            subjects: [],

            activeSubjectId: null,

            activeRangeId: null

          };

          saveState();

        } else if (raw) {

          state = JSON.parse(raw);

          if (!state.folders) state.folders = [];

          if (!state.subjects) state.subjects = [];



          validateStateDefensive();

          saveState();

        }

      } catch (err) {

        console.error('Failed to parse state from localStorage', err);

        state = {

          folders: [],

          activeFolderId: null,

          subjects: [],

          activeSubjectId: null,

          activeRangeId: null

        };

        saveState();

      }



      // Load Theme (Default to 'sage' eye-care reading mode)

      const savedTheme = localStorage.getItem(THEME_KEY) || 'sage';

      const validThemes = ['sage', 'dusk', 'light'];

      if (!validThemes.includes(savedTheme)) {

        setTheme('sage');

        document.getElementById('themeSelector').value = 'sage';

      } else {

        setTheme(savedTheme);

        document.getElementById('themeSelector').value = savedTheme;

      }

    }



    function saveState() {

      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    }



    function setTheme(themeName) {

      document.documentElement.setAttribute('data-theme', themeName);

      localStorage.setItem(THEME_KEY, themeName);

    }



    function getActiveFolder() {

      const contextFolders = getContextFolders();

      const activeId = getContextActiveFolderId();

      return contextFolders.find(f => f.id === activeId) || null;

    }



    function getFilteredSubjects() {

      const activeFolder = getActiveFolder();

      return activeFolder ? (activeFolder.subjects || []) : [];

    }



    function validateStateDefensive() {

      const visibleSubjects = getFilteredSubjects();

      const currSub = visibleSubjects.find(s => s.id === state.activeSubjectId);

      if (!currSub) {

        state.activeSubjectId = visibleSubjects.length > 0 ? visibleSubjects[0].id : null;

      }



      const activeSubObj = visibleSubjects.find(s => s.id === state.activeSubjectId);

      if (activeSubObj && activeSubObj.ranges) {

        const currRng = activeSubObj.ranges.find(r => r.id === state.activeRangeId);

        if (!currRng) {

          state.activeRangeId = activeSubObj.ranges.length > 0 ? activeSubObj.ranges[0].id : null;

        }

      } else {

        state.activeRangeId = null;

      }

    }



    // --- Helper Functions ---



    function generateId(prefix = 'id') {

      if (typeof crypto !== 'undefined' && crypto.randomUUID) {

        return `${prefix}_${crypto.randomUUID().substr(0, 8)}`;

      }

      return `${prefix}_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;

    }



    function generateNumericInviteCode() {

      return Math.floor(100000 + Math.random() * 900000).toString();

    }



    function normalizeUrl(url) {

      let trimmed = url.trim();

      if (!/^https?:\/\//i.test(trimmed)) {

        trimmed = 'https://' + trimmed;

      }

      return trimmed;

    }



    function getActiveSubject() {

      const visibleSubjects = getFilteredSubjects();

      return visibleSubjects.find(s => s.id === state.activeSubjectId) || null;

    }



    function getActiveRange() {

      const sub = getActiveSubject();

      if (!sub || !sub.ranges) return null;

      return sub.ranges.find(r => r.id === state.activeRangeId) || null;

    }

    async function applyPresetMode(modeKey, isReset = false) {

      const preset = PRESET_MODES[modeKey];

      if (!preset) return;



      state.currentPresetMode = modeKey;



      if (currentDashboardContext === 'personal' && supabaseClient && currentUser) {

        try {

          // Update profile current_preset_mode

          await supabaseClient.from('profiles').update({ current_preset_mode: modeKey }).eq('id', currentUser.id);



          if (isReset) {

            await supabaseClient.from('subjects').delete().eq('user_id', currentUser.id).is('group_id', null).eq('preset_mode', modeKey);

            state.subjects = (state.subjects || []).filter(s => (s.preset_mode || 'senior') !== modeKey);

          }



          await loadDashboardData();

          showToast(`已成功切換至【${preset.name}】獨立看板`, 'success');

        } catch (err) {

          console.error('Failed applying preset to Supabase:', err);

          showToast('切換預設模式失敗: ' + err.message, 'danger');

        }

      } else {

        // Local / Offline mode

        const activeFolder = getActiveFolder();

        if (!activeFolder) {

          showToast('尚未建立任何專案資料夾', 'warning');

          return;

        }



        if (isReset) {

          activeFolder.subjects = (activeFolder.subjects || []).filter(s => (s.preset_mode || 'senior') !== modeKey);

        }



        const modeSubs = (activeFolder.subjects || []).filter(s => (s.preset_mode || 'senior') === modeKey);

        if (modeSubs.length === 0 && preset.subjects.length > 0) {

          if (!activeFolder.subjects) activeFolder.subjects = [];

          preset.subjects.forEach((pSub, idx) => {

            activeFolder.subjects.push({

              id: `sub_${modeKey}_${Date.now()}_${idx}`,

              name: pSub.name,

              preset_mode: modeKey,

              ranges: []

            });

          });

        }



        validateStateDefensive();

        saveState();

        renderAll();

        showToast(`已成功切換至【${preset.name}】獨立看板`, 'success');

      }

    }

                  if (error) throw error;

                  const { data: publicUrlData } = supabaseClient.storage.from('avatars').getPublicUrl(filename);

                  finalAvatarUrl = publicUrlData.publicUrl;

                  uploadedToStorage = true;

                  localStorage.removeItem(`local_avatar_${currentUser.id}`);

                  console.error('Failed to upload avatar to Supabase Storage, falling back to localStorage', err);

            } else {

              localStorage.removeItem(`local_avatar_${currentUser.id}`);

            }



            currentUser.avatarUrl = avatarUrl.startsWith('data:image/') && !uploadedToStorage ? avatarUrl : finalAvatarUrl;



            if (supabaseClient) {

        const statusEl = document.getElementById('avatarUploadStatus');

        if (statusEl) statusEl.textContent = '';

      };



      const fileInput = document.getElementById('inputAvatarFile');

      if (fileInput) {

        fileInput.addEventListener('change', function (e) {

          const file = e.target.files[0];

          if (!file) return;



          const statusEl = document.getElementById('avatarUploadStatus');

          statusEl.textContent = '處理中...';

          statusEl.className = 'text-xs text-[var(--hh-text-dim)] truncate max-w-[120px]';



          const reader = new FileReader();

          reader.onload = function (event) {

            const img = new Image();

            img.onload = function () {

              const canvas = document.createElement('canvas');

              const maxSize = 400;

              let width = img.width;

              let height = img.height;



              if (width > height) {

                if (width > maxSize) {

                  height *= maxSize / width;

                  width = maxSize;

                }

              } else {

                if (height > maxSize) {

                  width *= maxSize / height;

                  height = maxSize;

                }

              }



              canvas.width = width;

              canvas.height = height;

              const ctx = canvas.getContext('2d');

              ctx.drawImage(img, 0, 0, width, height);



              const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

              document.getElementById('inputAvatarUrl').value = dataUrl;

              statusEl.textContent = '載入成功';

              statusEl.className = 'text-xs text-[var(--hh-accent-green)] font-bold truncate max-w-[120px]';

            };

            img.src = event.target.result;

          };

          reader.readAsDataURL(file);

        });

      }

    }

    async function leaveGroup(groupId, groupName) {

      if (!supabaseClient || !currentUser) return;



      const membership = myGroups.find(g => g.id === groupId);

      if (!membership) return;



      openModal({

        title: '⚠️ 退出群組確認',

        icon: 'log-out',

        contentHtml: `

          <div class="text-sm text-[var(--hh-paragraph)]">

            確定要退出群組 <strong>${escapeHtml(groupName)}</strong> 嗎？

          </div>

        `,

        confirmText: '確定退出',

        onConfirm: async () => {

          const isOwner = membership.owner_id === currentUser.id;



          if (isOwner) {

            const { data: members, error: memErr } = await supabaseClient

              .from('group_members')

              .select('*')

              .eq('group_id', groupId)

              .neq('user_id', currentUser.id)

              .order('joined_at', { ascending: true });



            if (memErr) {

              showToast('退出群組失敗: 讀取成員錯誤', 'danger');

              closeModal();

              return;

            }



            if (members && members.length > 0) {

              const nextOwner = members[0];

              await supabaseClient.from('groups').update({ owner_id: nextOwner.user_id }).eq('id', groupId);

              await supabaseClient.from('group_members').update({ role: 'owner' }).eq('group_id', groupId).eq('user_id', nextOwner.user_id);

              const { error: delErr } = await supabaseClient.from('group_members').delete().eq('group_id', groupId).eq('user_id', currentUser.id);

              if (delErr) {

                showToast('退出群組時發生錯誤', 'danger');

              } else {

                showToast('已退出群組，建立者權限已自動移交', 'success');

              }

            } else {

              await supabaseClient.from('groups').delete().eq('id', groupId);

              showToast('已退出並自動解散群組', 'success');

            }

          } else {

            const { error: delErr } = await supabaseClient.from('group_members').delete().eq('group_id', groupId).eq('user_id', currentUser.id);

            if (delErr) {

              showToast('退出群組失敗: ' + delErr.message, 'danger');

            } else {

              showToast('已成功退出群組', 'success');

            }

          }



          if (currentDashboardContext === groupId) {

            await switchDashboardContext('personal');

          } else {

            await loadUserGroups();

          }

          closeModal();

        }

      });

    }

    // --- Toast Notification System ---



    function showToast(message, type = 'success') {

      const container = document.getElementById('toastContainer');

      const toast = document.createElement('div');



      let borderColors = 'bg-[var(--hh-btn-main)] text-[var(--hh-btn-text)] border-2 border-[var(--hh-card-border)]';

      let iconName = 'check-circle-2';



      if (type === 'info') {

        borderColors = 'bg-[var(--hh-accent-blush)] text-[var(--hh-card-border)] border-2 border-[var(--hh-card-border)]';

        iconName = 'info';

      } else if (type === 'danger') {

        borderColors = 'bg-rose-500 text-white border-2 border-rose-900';

        iconName = 'alert-circle';

      }



      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-[4px_4px_0px_0px_var(--hh-shadow)] text-xs font-bold transition-all duration-300 animate-pop-in ${borderColors}`;

      toast.innerHTML = `

        <i data-lucide="${iconName}" class="w-4 h-4 shrink-0"></i>

        <span>${escapeHtml(message)}</span>

      `;



      container.appendChild(toast);

      lucide.createIcons({ props: { searchTarget: toast } });



      setTimeout(() => {

        toast.style.opacity = '0';

        toast.style.transform = 'translateY(10px)';

        setTimeout(() => toast.remove(), 300);

      }, 2800);

    }



    function escapeHtml(str) {

      if (!str) return '';

      return String(str).replace(/[&<>"']/g, (m) => {

        return {

          '&': '&amp;',

          '<': '&lt;',

          '>': '&gt;',

          '"': '&quot;',

          "'": '&#039;'

        }[m];

      });

    }

            (gRanges || []).forEach(r => groupRangesMap.set(`${r.subject_id}_${r.name}`, r));

            const groupLinksSet = new Set(); // key: range_id_url_title

            (gLinks || []).forEach(l => groupLinksSet.set(`${l.range_id}_${l.url}_${l.title}`, true));



            for (const subId of selectedSubIds) {

              const pSub = pSubjects.find(s => s.id === subId);

              if (!pSub) continue;



              // 1. Merge Subject

              let targetSub = groupSubjectsMap.get(pSub.name);

              if (!targetSub) {

                const { data: newSub, error: insSubErr } = await supabaseClient.from('subjects').insert({

                  name: pSub.name,

                  user_id: currentUser.id,

                  group_id: currentGroupId,

                  preset_mode: targetFolderId

                }).select().single();

                if (insSubErr) throw insSubErr;

                targetSub = newSub;

                groupSubjectsMap.set(targetSub.name, targetSub);

                importedSubsCount++;

              }



              // 2. Merge Ranges

              const subRanges = (pRanges || []).filter(r => r.subject_id === pSub.id);

              for (const pRange of subRanges) {

                let targetRange = groupRangesMap.get(`${targetSub.id}_${pRange.name}`);

                if (!targetRange) {

                  const { data: newRange, error: insRngErr } = await supabaseClient.from('ranges').insert({

                    subject_id: targetSub.id,

                    name: pRange.name

                  }).select().single();

                  if (insRngErr) throw insRngErr;

                  targetRange = newRange;

                  groupRangesMap.set(`${targetSub.id}_${targetRange.name}`, targetRange);

                  importedRangesCount++;

                }



                // 3. Merge Links

                const rangeLinks = (pLinks || []).filter(l => l.range_id === pRange.id);

                for (const pLink of rangeLinks) {

                  const linkKey = `${targetRange.id}_${pLink.url}_${pLink.title}`;

                  if (!groupLinksSet.has(linkKey)) {

                    const { error: insLnkErr } = await supabaseClient.from('resource_links').insert({

                      range_id: targetRange.id,

                      title: pLink.title,

                      url: pLink.url,

                      created_by: currentUser.id,

                      last_edited_by: currentUser.id

                    });

                    if (insLnkErr) throw insLnkErr;

                    groupLinksSet.add(linkKey);

                    importedLinksCount++;

                  }

                }

              }

            }



            Swal.fire({

              icon: 'success',

              title: '匯入成功！',

              text: `共匯入 ${importedSubsCount} 個科目、${importedRangesCount} 個單元與 ${importedLinksCount} 個資源連結`,

              timer: 3000,

              showConfirmButton: false

            });

            await loadDashboardData(); // Refresh UI

          } catch (err) {

            console.error('Import Error:', err);

            Swal.fire('匯入失敗', err.message || '發生未知錯誤', 'error');

          }

        }

      });



      // Handle Select All logic

      setTimeout(() => {

        const btnSelectAll = document.getElementById('btnImportSelectAll');

        if (btnSelectAll) {

          btnSelectAll.onclick = () => {

            const checkboxes = document.querySelectorAll('.import-subject-cb');

            const allChecked = Array.from(checkboxes).every(cb => cb.checked);

            checkboxes.forEach(cb => cb.checked = !allChecked);

          };

        }

      }, 100);

    }

              preset_mode: folderId,

          const newFolder = {

            subjects: initSubjects

          renderAll();

    function getAllSearchableSubjects() {

      const items = [];

      const contextFolders = getContextFolders();

      if (contextFolders && Array.isArray(contextFolders)) {

        contextFolders.forEach(folder => {

          if (folder.subjects && Array.isArray(folder.subjects)) {

            folder.subjects.forEach(sub => {

              items.push({

                ...sub,

                folderId: folder.id,

                folderName: folder.name

              });

            });

          }

        });

      }

      return items;

    }



    function performSearch(query) {

      const q = query.trim().toLowerCase();

      const btnClear = document.getElementById('btnClearSearch');

      const countEl = document.getElementById('searchResultCount');



      if (q) btnClear.classList.remove('hidden');

      else btnClear.classList.add('hidden');



      currentSearchResults = [];

      const searchableSubjects = getAllSearchableSubjects();



      searchableSubjects.forEach(sub => {

        const isSubMatch = !q || sub.name.toLowerCase().includes(q);



        // 1. Subject match

        if (isSubMatch) {

          currentSearchResults.push({

            type: 'subject',

            id: sub.id,

            subjectId: sub.id,

            folderId: sub.folderId,

            title: sub.name,

            subtitle: sub.folderName ? `科目 📍 ${sub.folderName}` : `科目`,

            icon: 'book-open'

          });

        }



        // 2. Range & Link match

        if (sub.ranges && Array.isArray(sub.ranges)) {

          sub.ranges.forEach(rng => {

            const isRngNameMatch = q ? rng.name.toLowerCase().includes(q) : false;

            const isRngMatch = !q || isRngNameMatch || (q && sub.name.toLowerCase().includes(q));



            if (isRngMatch) {

              const subPath = sub.folderName ? `${sub.folderName} > ${sub.name}` : sub.name;

              currentSearchResults.push({

                type: 'range',

                id: rng.id,

                subjectId: sub.id,

                rangeId: rng.id,

                folderId: sub.folderId,

                title: rng.name,

                subtitle: `單元範圍 📍 ${subPath}`,

                icon: 'bookmark'

              });

            }



            if (rng.links && Array.isArray(rng.links)) {

              rng.links.forEach(lnk => {

                const isLnkTitleMatch = q ? (lnk.title || '').toLowerCase().includes(q) : false;

                const isLnkUrlMatch = q ? (lnk.url || '').toLowerCase().includes(q) : false;

                const isLnkMatch = !q || isLnkTitleMatch || isLnkUrlMatch || (q && (isRngNameMatch || sub.name.toLowerCase().includes(q)));



                if (isLnkMatch) {

                  const rngPath = sub.folderName ? `${sub.folderName} > ${sub.name} > ${rng.name}` : `${sub.name} > ${rng.name}`;

                  currentSearchResults.push({

                    type: 'link',

                    id: lnk.id,

                    subjectId: sub.id,

                    rangeId: rng.id,

                    linkId: lnk.id,

                    folderId: sub.folderId,

                    title: lnk.title,

                    subtitle: `學習連結 📍 ${rngPath}`,

                    icon: 'external-link',

                    url: lnk.url

                  });

                }

              });

            }

          });

        }

      });



      countEl.textContent = `${currentSearchResults.length} 筆結果`;

      selectedResultIndex = currentSearchResults.length > 0 ? 0 : -1;

      renderSearchResults(currentSearchResults, q);

    }



    function renderSearchResults(results, query) {

      const container = document.getElementById('searchResultsList');

      container.innerHTML = '';



      if (results.length === 0) {

        container.innerHTML = `

          <div class="text-center py-10 px-4 text-[var(--hh-paragraph)] opacity-60">

            <i data-lucide="search-x" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>

            <p class="text-xs font-bold">找不到包含「${escapeHtml(query)}」的學習資料</p>

          </div>

        `;

        lucide.createIcons({ props: { searchTarget: container } });

        return;

      }



      results.forEach((res, index) => {

        const item = document.createElement('div');

        const isSelected = index === selectedResultIndex;



        let typeBadge = '';

        if (res.type === 'subject') {

          typeBadge = `<span class="px-2 py-0.5 text-[10px] font-extrabold rounded-md bg-emerald-100 text-emerald-800 border border-emerald-300 dark:bg-emerald-950 dark:text-emerald-300">科目</span>`;

        } else if (res.type === 'range') {

          typeBadge = `<span class="px-2 py-0.5 text-[10px] font-extrabold rounded-md bg-sky-100 text-sky-800 border border-sky-300 dark:bg-sky-950 dark:text-sky-300">單元範圍</span>`;

        } else {

          typeBadge = `<span class="px-2 py-0.5 text-[10px] font-extrabold rounded-md bg-amber-100 text-amber-800 border border-amber-300 dark:bg-amber-950 dark:text-amber-300">學習連結</span>`;

        }



        item.className = `search-result-item flex items-center justify-between p-3 rounded-xl cursor-pointer transition-all duration-150 border-2 ${isSelected

          ? 'hh-card-active border-[var(--hh-card-border)] ring-2 ring-[var(--hh-btn-main)]'

          : 'bg-[var(--hh-card)] border-[var(--hh-card-border)] hover:border-[var(--hh-card-hover-border)]'

          }`;

        item.dataset.index = index;



        item.innerHTML = `

          <div class="flex items-center gap-3 overflow-hidden">

            <div class="w-9 h-9 rounded-xl bg-[var(--hh-accent-ice)] border-2 border-[var(--hh-card-border)] flex items-center justify-center shrink-0">

              <i data-lucide="${res.icon}" class="w-4 h-4 text-[var(--hh-headline)]"></i>

            </div>

            <div class="overflow-hidden">

              <h5 class="text-xs font-black hh-headline truncate">${escapeHtml(res.title)}</h5>

              <p class="text-[11px] font-semibold text-[var(--hh-paragraph)] opacity-80 truncate">${escapeHtml(res.subtitle)}</p>

            </div>

          </div>

          <div class="flex items-center gap-2 shrink-0 ml-2">

            ${typeBadge}

            <i data-lucide="corner-down-left" class="w-4 h-4 text-[var(--hh-paragraph)] opacity-50"></i>

          </div>

        `;



        item.onclick = () => navigateToResult(res);

        item.onmouseenter = () => {

          selectedResultIndex = index;

          updateSearchResultHighlights();

        };



        container.appendChild(item);

      });



      lucide.createIcons({ props: { searchTarget: container } });

    }



    function updateSearchResultHighlights() {

      const items = document.querySelectorAll('.search-result-item');

      items.forEach((el, idx) => {

        if (idx === selectedResultIndex) {

          el.classList.add('hh-card-active', 'ring-2', 'ring-[var(--hh-btn-main)]');

          el.classList.remove('bg-[var(--hh-card)]');

          el.scrollIntoView({ block: 'nearest' });

        } else {

          el.classList.remove('hh-card-active', 'ring-2', 'ring-[var(--hh-btn-main)]');

          el.classList.add('bg-[var(--hh-card)]');

        }

      });

    }



    function navigateToResult(res) {

      if (!res) return;



      if (res.folderId && state.folders) {

        const folderExists = state.folders.some(f => f.id === res.folderId);

        if (folderExists) {

          setContextActiveFolderId(res.folderId);

        }

      }



      state.activeSubjectId = res.subjectId;

      if (res.rangeId) state.activeRangeId = res.rangeId;



      saveState();



      if (window.innerWidth <= 1024) {

        if (res.type === 'link' || res.type === 'range') currentMobileTab = 'links';

        else currentMobileTab = 'nav';

      }



      renderAll();

      closeSearchModal();



      const visibleSubjects = getFilteredSubjects();

      const subObj = visibleSubjects.find(s => s.id === res.subjectId);

      const subName = subObj ? subObj.name : '';

      const displayTitle = res.type === 'subject' ? subName : `${subName}${res.title ? ' > ' + res.title : ''}`;

      showToast(`已跳轉至：「${displayTitle}」`, 'success');

    }



    // --- DOM Event Listeners & Dashboard Context Event Routing ---



    document.addEventListener('DOMContentLoaded', () => {

      loadState();

      initSupabase();

      renderAll();



      // Dashboard Context Selection Event

      document.getElementById('dashboardContextSelect').addEventListener('change', async (e) => {

        const val = e.target.value;

        if (val === 'action_create_group') {

          e.target.value = currentDashboardContext;

          promptCreateGroupModal();

        } else if (val === 'action_join_group') {

          e.target.value = currentDashboardContext;

          promptJoinGroupModal();

        } else if (val === 'action_manage_groups') {

          e.target.value = currentDashboardContext;

          promptManageGroupsModal();

        } else {

          currentDashboardContext = val;

          if (val === 'personal') {

            showToast('已切換為：個人雲端 Dashboard', 'info');

          } else {

            const grp = myGroups.find(g => g.id === val);

            showToast(`已切換為群組：「${grp ? grp.name : val}」 (全員平權共享模式)`, 'success');

          }

          await loadDashboardData();

          setupRealtimeSubscription();

        }

      });



      // Search Trigger & Modal Bindings

      document.getElementById('btnOpenSearch').addEventListener('click', openSearchModal);



      const searchInput = document.getElementById('searchInput');

      searchInput.addEventListener('input', (e) => performSearch(e.target.value));



      document.getElementById('btnClearSearch').addEventListener('click', () => {

        searchInput.value = '';

        performSearch('');

        searchInput.focus();

      });



      document.getElementById('searchModalOverlay').addEventListener('click', (e) => {

        if (e.target === document.getElementById('searchModalOverlay')) closeSearchModal();

      });



      // Keyboard Navigation

      document.addEventListener('keydown', (e) => {

        const searchOverlay = document.getElementById('searchModalOverlay');

        const isSearchOpen = searchOverlay && !searchOverlay.classList.contains('opacity-0');



        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {

          e.preventDefault();

          if (isSearchOpen) closeSearchModal();

          else openSearchModal();

          return;

        }



        if (isSearchOpen) {

          if (e.key === 'Escape') closeSearchModal();

          else if (e.key === 'ArrowDown') {

            e.preventDefault();

            if (currentSearchResults.length > 0) {

              selectedResultIndex = (selectedResultIndex + 1) % currentSearchResults.length;

              updateSearchResultHighlights();

            }

          } else if (e.key === 'ArrowUp') {

            e.preventDefault();

            if (currentSearchResults.length > 0) {

              selectedResultIndex = (selectedResultIndex - 1 + currentSearchResults.length) % currentSearchResults.length;

              updateSearchResultHighlights();

            }

          } else if (e.key === 'Enter') {

            e.preventDefault();

            if (selectedResultIndex >= 0 && selectedResultIndex < currentSearchResults.length) {

              navigateToResult(currentSearchResults[selectedResultIndex]);

            }

          }

        } else if (e.key === 'Escape') {

          closeModal();

        }

      });



      // Theme Switcher Event

      const themeNamesMap = {

        'sage': '🌿 舒緩森林',

        'dusk': '🌙 柔和夜讀',

        'light': '☀️ 極簡明亮'

      };

      document.getElementById('themeSelector').addEventListener('change', (e) => {

        const val = e.target.value;

        setTheme(val);

        const label = themeNamesMap[val] || val;

        showToast(`已切換為：${label}`, 'info');

      });



      // iPad Portrait Tabs Event Controls

      document.getElementById('tabBtnNav').addEventListener('click', () => setMobileTab('nav'));

      document.getElementById('tabBtnLinks').addEventListener('click', () => setMobileTab('links'));



      // Window Resize Handler

      window.addEventListener('resize', updateMobileTabsVisibility);



      // Subject / Range Add Buttons

      document.getElementById('btnAddSubject').addEventListener('click', promptAddSubject);

      document.getElementById('btnImportPersonalData').addEventListener('click', promptImportPersonalDataModal);

      document.getElementById('btnAddRange').addEventListener('click', promptAddRange);



      // Link Form Submit

      document.getElementById('linkForm').addEventListener('submit', handleAddLink);



      // Modal Bindings

      document.getElementById('btnModalClose').addEventListener('click', closeModal);

      document.getElementById('btnModalCancel').addEventListener('click', closeModal);

      document.getElementById('btnModalConfirm').addEventListener('click', () => {

        if (modalConfirmCallback) modalConfirmCallback();

      });

      document.getElementById('modalOverlay').addEventListener('click', (e) => {

        if (e.target === document.getElementById('modalOverlay')) closeModal();

      });

    });

  </script>

</body>
